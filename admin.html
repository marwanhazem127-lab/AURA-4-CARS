<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AURA | إدارة المتجر</title><style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');*{box-sizing:border-box}body{margin:0;background:#09060e;color:white;font-family:Cairo,Tahoma,Arial}.wrap{max-width:1100px;margin:auto;padding:30px 18px}.box{background:#150e1e;border:1px solid #ffffff20;border-radius:18px;padding:22px;margin:18px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{width:100%;padding:12px;border-radius:10px;border:1px solid #ffffff2b;background:#0d0913;color:white;font:inherit}.btn{border:0;border-radius:12px;padding:11px 20px;background:linear-gradient(100deg,#9200e8,#d12cff);color:white;font:700 14px Cairo;cursor:pointer}.btn.alt{background:#24152f;border:1px solid #ffffff33}.btn.danger{background:#651b35}.muted{color:#bdb3c8;font-size:13px;line-height:1.8}.hidden{display:none!important}.item{border-top:1px solid #ffffff20;padding:15px 0}.itemtop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="itemtop"><h1>AURA FOR CARS — لوحة الإدارة</h1><a href="index.html" style="color:#d99bff">العودة للمتجر</a></div><section class="box" id="login"><h2>دخول الإدارة</h2><p class="muted">استخدم البريد وكلمة المرور اللذين أنشأتهما في Supabase Authentication.</p><input class="field" id="email" type="email" placeholder="البريد الإلكتروني"><br><br><input class="field" id="password" type="password" placeholder="كلمة المرور"><br><br><button class="btn" id="loginBtn">دخول</button><p id="loginMsg" class="muted"></p></section><div id="panel" class="hidden"><section class="box"><div class="itemtop"><h2>إضافة / تعديل منتج</h2><button class="btn alt" id="newBtn">منتج جديد</button></div><input id="pid" type="hidden"><div class="grid"><input class="field" id="name" placeholder="اسم المنتج"><select class="field" id="category"><option>خارجي</option><option>داخلي</option><option>ستايل</option></select><input class="field" id="price" type="number" min="0" placeholder="السعر بالجنيه"><input class="field" id="stock" type="number" min="0" placeholder="الكمية بالمخزون"><input class="field" id="desc" placeholder="وصف المنتج"><input class="field" id="image" placeholder="رابط صورة المنتج (اختياري)"></div><br><button class="btn" id="saveBtn">حفظ المنتج</button><p id="productMsg" class="muted"></p></section><section class="box"><h2>المنتجات</h2><div id="products"></div></section><section class="box"><div class="itemtop"><h2>طلبات العملاء</h2><button class="btn alt" id="refresh">تحديث</button></div><div id="orders"></div></section><button class="btn danger" id="logout">تسجيل الخروج</button></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const $=s=>document.querySelector(s),db=supabase.createClient(AURA_CONFIG.url,AURA_CONFIG.anonKey);let currentUser=null;
async function adminCheck(){const {data:{user}}=await db.auth.getUser();if(!user)return false;const {data,error}=await db.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(error)throw error;currentUser=user;return !!data}
async function showPanel(){try{if(await adminCheck()){$('#login').classList.add('hidden');$('#panel').classList.remove('hidden');await Promise.all([loadProducts(),loadOrders()])}else{$('#loginMsg').textContent='الحساب مسجل لكنه ليس ضمن حسابات الإدارة. راجع صلاحيات admin_users.'}}catch(e){$('#loginMsg').textContent='تعذر التحقق من صلاحيات الإدارة: '+e.message}}
$('#loginBtn').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error){$('#loginMsg').textContent=error.message;return}await showPanel()};$('#logout').onclick=async()=>{await db.auth.signOut();location.reload()};
function clearForm(){$('#pid').value='';$('#name').value='';$('#category').value='خارجي';$('#price').value='';$('#stock').value='0';$('#desc').value='';$('#image').value=''}$('#newBtn').onclick=clearForm;
async function loadProducts(){const {data,error}=await db.from('products').select('*').order('created_at',{ascending:false});if(error)throw error;$('#products').innerHTML=(data||[]).map(p=>`<div class="item itemtop"><div><b>${p.name}</b><div class="muted">${p.category} — ${p.price} ج.م — المخزون: ${p.stock} — ${p.active?'نشط':'مخفي'}</div></div><div class="row"><button class="btn alt" onclick="editProduct('${p.id}')">تعديل</button><button class="btn danger" onclick="deleteProduct('${p.id}')">حذف</button></div></div>`).join('')||'<p class="muted">لا توجد منتجات.</p>';window.productRows=data||[]}
window.editProduct=id=>{let p=window.productRows.find(x=>x.id===id);$('#pid').value=p.id;$('#name').value=p.name;$('#category').value=p.category;$('#price').value=p.price;$('#stock').value=p.stock;$('#desc').value=p.description||'';$('#image').value=p.image_url||'';window.scrollTo({top:0,behavior:'smooth'})};
window.deleteProduct=async id=>{if(!confirm('تأكيد حذف المنتج؟'))return;let {error}=await db.from('products').delete().eq('id',id);if(error)alert(error.message);else loadProducts()};
$('#saveBtn').onclick=async()=>{let name=$('#name').value.trim(),price=Number($('#price').value),stock=Number($('#stock').value);if(!name||!Number.isFinite(price)||price<0||!Number.isInteger(stock)||stock<0){$('#productMsg').textContent='راجع الاسم والسعر والمخزون.';return}let row={name,category:$('#category').value,price,stock,description:$('#desc').value.trim(),image_url:$('#image').value.trim(),active:true};let q=$('#pid').value?db.from('products').update(row).eq('id',$('#pid').value):db.from('products').insert(row);let {error}=await q;if(error)$('#productMsg').textContent=error.message;else{$('#productMsg').textContent='تم الحفظ.';clearForm();loadProducts()}};
async function loadOrders(){let {data:orders,error}=await db.from('orders').select('id,order_number,customer_name,phone,governorate,address,notes,subtotal,status,created_at,order_items(product_name,quantity,unit_price,line_total)').order('created_at',{ascending:false});if(error)throw error;$('#orders').innerHTML=(orders||[]).map(o=>`<article class="item"><div class="itemtop"><b>${o.order_number} — ${o.customer_name}</b><span class="muted">${new Date(o.created_at).toLocaleString('ar-EG')}</span></div><p class="muted">📞 ${o.phone} | ${o.governorate}<br>العنوان: ${o.address}<br>ملاحظات: ${o.notes||'—'}</p><p class="muted">${(o.order_items||[]).map(i=>`${i.product_name} × ${i.quantity} — ${i.line_total} ج.م`).join('<br>')}</p><b>الإجمالي: ${o.subtotal} ج.م</b><div class="row"><select class="field" style="max-width:220px" onchange="changeStatus('${o.id}',this.value)">${['new','confirmed','preparing','shipped','delivered','cancelled'].map((v,i)=>`<option value="${v}" ${o.status===v?'selected':''}>${['طلب جديد','تم التأكيد','قيد التجهيز','تم الشحن','تم التسليم','ملغي'][i]}</option>`).join('')}</select></div></article>`).join('')||'<p class="muted">لا توجد طلبات حتى الآن.</p>'}
window.changeStatus=async(id,status)=>{let {error}=await db.from('orders').update({status}).eq('id',id);if(error)alert(error.message)};$('#refresh').onclick=()=>loadOrders();db.auth.getSession().then(({data})=>{if(data.session)showPanel()});
</script></body></html>
